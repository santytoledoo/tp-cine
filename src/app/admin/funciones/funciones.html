<div class="admin-container">
  <h2>Programar Función</h2>
  <p>El sistema asignará automáticamente una sala disponible.</p>

  <form [formGroup]="funcionForm" (ngSubmit)="programarFuncion()">
    
    <div class="form-group">
      <label>Película</label>
      <select formControlName="pelicula_id">
        <option value="" disabled selected>Seleccioná una película</option>
        <option *ngFor="let p of peliculas" [value]="p.id">
          {{ p.titulo }} ({{ p.duracion_minutos }} min)
        </option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fecha de la función</label>
        <input type="date" formControlName="fecha">
      </div>
      <div class="form-group">
        <label>Hora de inicio</label>
        <input type="time" formControlName="hora_inicio">
      </div>
    </div>

    <div class="form-group">
      <label>Precio Base Entrada ($)</label>
      <input type="number" formControlName="precio_base">
    </div>

    <button type="submit" [disabled]="funcionForm.invalid">Asignar Sala y Guardar</button>
  </form>

  <p *ngIf="mensaje" class="mensaje-alerta">{{ mensaje }}</p>
</div>
