<div class="registro-container">
  <div class="registro-card">
    <h2>Registro de Usuario</h2>
    <p>Crea tu cuenta y obtené un 20% de descuento en tu primera compra[cite: 3].</p>

    @if (mensajeExito) {
      <div class="alert-success">{{ mensajeExito }}</div>
    }

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input type="text" formControlName="apellido" placeholder="Tu apellido">
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" formControlName="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label>Fecha de Nacimiento</label>
        <input type="date" formControlName="fechaNacimiento">
      </div>

      <div class="form-group">
        <label>Tipo de Sangre</label>
        <select formControlName="tipoSangre">
          <option value="">Seleccione...</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="0+">0+</option>
          <option value="0-">0-</option>
        </select>
      </div>

      <div class="form-group">
        <label>Color de Ojos</label>
        <input type="text" formControlName="colorOjos" placeholder="Ej: Marrones, Celestes">
      </div>

      <div class="form-group">
        <label>Días de Vacaciones por Año</label>
        <input type="number" formControlName="diasVacaciones" placeholder="Ej: 14">
      </div>

      <button type="submit" class="btn-submit" [disabled]="registroForm.invalid">Registrarse</button>
    </form>

    <p class="login-link">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión acá</a></p>
  </div>
</div>
